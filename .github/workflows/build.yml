name: Build

# Shared by CI, Nightly and Release so the three never drift apart.
on:
  workflow_call:
    inputs:
      tests:
        description: Build and run the regression tests
        type: boolean
        default: false
      package:
        description: Upload a packaged build per platform
        type: boolean
        default: false
      version:
        description: Version written into the package names
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            binary: Kestrel
          - name: windows-x64
            os: windows-2022
            binary: Kestrel.exe
          - name: macos-arm64
            os: macos-14
            binary: Kestrel

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config zlib1g-dev libssl-dev \
            libvulkan-dev glslc libwayland-dev libxkbcommon-dev wayland-protocols \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache openssl@3

      - name: Install MSYS2 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-openssl
            git

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKESTREL_BUILD_TESTS=${{ inputs.tests && 'ON' || 'OFF' }} \
            -DKESTREL_BUILD_EXAMPLE_MODS=${{ inputs.tests && 'ON' || 'OFF' }}
          cmake --build build --parallel

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DKESTREL_BUILD_TESTS=${{ inputs.tests && 'ON' || 'OFF' }}
          cmake --build build --parallel

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKESTREL_BUILD_TESTS=${{ inputs.tests && 'ON' || 'OFF' }}
          cmake --build build --parallel 4

      - name: Run tests
        if: inputs.tests && runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (Windows)
        if: inputs.tests && runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: inputs.package
        id: package
        shell: bash
        env:
          NAME: Kestrel-${{ inputs.version }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "stage/$NAME" dist
          cp "build/${{ matrix.binary }}" LICENSE COPYING README.md "stage/$NAME/"
          cd stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$NAME.zip"
            7z a -tzip "../dist/$archive" "$NAME" > /dev/null
          else
            archive="$NAME.tar.gz"
            tar -czf "../dist/$archive" "$NAME"
          fi
          cd ../dist
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          ls -lh

      - name: Upload the package
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
